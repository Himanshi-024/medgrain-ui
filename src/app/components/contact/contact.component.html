<section id="contact" class="section contact">
  <div class="container">
    <div class="contact-grid">
      <div class="contact-info" appReveal>
        <p class="eyebrow">Contact Us</p>
        <h2>Have a question or business enquiry?</h2>
        <p>
          Whether you are a customer, retailer, distributor, restaurant or bulk buyer,
          we would love to hear from you. Reach us directly — we reply fast.
        </p>

        <div class="contact-options">
          <a
            href="https://wa.me/919752928882?text=Hi%20Medgrain%2C%20I%20have%20an%20enquiry."
            target="_blank"
            rel="noopener"
            class="contact-option contact-option--whatsapp"
          >
            <span class="contact-option__icon">
              <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                <path d="M20.5 11.9c0 4.7-3.9 8.5-8.6 8.5-1.5 0-2.9-.4-4.1-1.1L3 20.5l1.2-4.6a8.4 8.4 0 0 1-1.3-4.5C2.9 6.7 6.7 3 11.4 3s9.1 3.9 9.1 8.9Z"/>
              </svg>
            </span>
            <span class="contact-option__text">
              <strong>Chat on WhatsApp</strong>
              <span>+91 97529 28882</span>
            </span>
            <span class="contact-option__arrow">→</span>
          </a>

          <a href="mailto:sustainzyagro@proton.me" class="contact-option contact-option--email">
            <span class="contact-option__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="24" height="24">
                <rect x="3" y="5" width="18" height="14" rx="2.5"/>
                <path d="m4 7 8 6 8-6"/>
              </svg>
            </span>
            <span class="contact-option__text">
              <strong>Email Us</strong>
              <span>sustainzyagro&#64;proton.me</span>
            </span>
            <span class="contact-option__arrow">→</span>
          </a>
        </div>
      </div>
